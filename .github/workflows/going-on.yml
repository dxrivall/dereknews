# "What's going on" fetcher for Derek News
# Pulls the same 11 Google News queries server-side every 5 minutes
# and writes going-on.json at the repo root. The site reads
# going-on.json first and only falls back to live rss2json when the
# file is missing or older than 30 minutes, so an rss2json rate
# limit no longer blanks the list. Same rules as the client code:
# 7-day freshness, newest-first, dedupe (exact-title key + collapse
# same first 8 words), top 6.
# Failure policy: if every query fails, the fetcher keeps the last
# good going-on.json and exits 0 — no broken file is ever written.
# Fetcher source: .src/fetch_going_on.py (embedded unchanged below).
# YAML fix: see kalshi-odds.yml - block scalar fetch step.
name: Going on

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: going-on
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch what's going on (Google News)
        run: |
          python3 - <<'PYEOF'
          """Fetch "What's going on" items server-side for Derek News.

          Pulls the same 9 Google News queries directly (server-side, no CORS
          issue), applies the same rules as the site's client code (7-day
          freshness, newest-first, dedupe: exact-title key + collapse same
          first 8 words), and writes going-on.json at the repo root:
          {updated_at (UTC ISO), items: [{title, link, date (ISO UTC)}]}.

          The site reads going-on.json first and only falls back to live
          rss2json when the file is missing or older than 30 minutes, so a
          rate-limited rss2json no longer blanks the list.

          The file stores ALL deduped items (not just the top 6), and each
          run merges the previous file's items forward through the same
          dedupe + 7-day cutoff — so an attack the current fetch can no
          longer see (Bing only reaches ~1-2 days back) is carried until it
          ages out, instead of the count dropping when the source window
          moves on.

          Tension index: the fetcher also counts Iran/US attacks in the
          last 7 days over the FULL merged list and writes it as
          "tension": {"attacks_7d": N, "level": "Low|Elevated|High|Severe"}.
          The rule: a headline counts when it names Iran (iran/irgc/tehran)
          + an attack word (attack/strike/drone/missile/fired/bomb...) + a
          US-side target (us/american/bahrain/base/radar/hormuz/vessel/ship/
          troops...), deduped by (ET calendar day, target) so several
          reports of the same strike count once. A plot or a threat with no
          attack does not count. 0 = Low, 1 = Elevated, 2 = High, 3+ =
          Severe. The site shows the level big with the count under it; the
          client counts the same way from the live rss2json fallback when
          going-on.json is stale.

          Failure policy: if every query fails, keep the last good
          going-on.json and exit 0 — no broken or empty file is ever written
          on a total failure. If at least one query succeeds, write what we
          have (possibly an empty items list, which is the honest quiet state).
          Fetcher source: .src/fetch_going_on.py (embedded unchanged in the
          workflow below).
          """
          import json
          import pathlib
          import re
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          ROOT = pathlib.Path(__file__).resolve().parent.parent
          OUT = ROOT / "going-on.json"

          QUERIES = [
              'ransomware attack',
              '"data breach"',
              'cyber hack OR hacked OR cyberattack',
              '"major outage" OR "service outage" hack',
              'bank outage OR "online banking" down OR "banking delays"',
              'airline grounded OR "ground stop" OR flights grounded',
              '"emergency alert test" OR "EAS test"',
              'Iran attack US base Bahrain OR Kuwait',
              'Iran dirty bomb Washington',
          ]

          UA = {"User-Agent": "Mozilla/5.0 (compatible; DerekNewsBot/1.0; +https://dxrivall.github.io/dereknews/)"}


          def gnews_url(q):
              return ("https://news.google.com/rss/search?q="
                      + urllib.parse.quote(q + " when:7d")
                      + "&hl=en-US&gl=US&ceid=US:en")


          def fetch_items(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = r.read()
              root = ET.fromstring(data)
              items = []
              for it in root.iter("item"):
                  title = (it.findtext("title") or "").strip()
                  link = (it.findtext("link") or "").strip()
                  pub = (it.findtext("pubDate") or "").strip()
                  if not title or not link or not pub:
                      continue
                  try:
                      d = parsedate_to_datetime(pub)
                  except (TypeError, ValueError):
                      continue
                  if d is None:
                      continue
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  items.append({"title": title, "link": link, "when": d})
              return items


          # Queries whose failure would break the tension count get two
          # fallbacks. Nov 18, 2026: Google News started rate-limiting the
          # GitHub runner IPs, so the direct fetch failed on every run for
          # ~24h while the runs still exited 0 — going-on.json went stale and
          # the tension count froze. rss2json fetches the same feed from its
          # own servers, so it works when the runner is blocked — but Google
          # ALSO throttles rss2json's fetch of the hot war query, so rss2json
          # itself returns "The feed host is rate limiting requests" for it.
          # Bing News RSS is the second fallback: it works from the runner
          # (verified Nov 18 — 12 items, parses with the same XML reader),
          # but only reaches ~1-2 days back, so the merge below carries older
          # attacks forward. Kept to the war query only: it is the one that
          # feeds the tension count (the list this file used to feed was
          # removed Nov 17), and rss2json is a shared free service — don't
          # burn its quota on the other queries.
          FALLBACK_QUERIES = {'Iran attack US base Bahrain OR Kuwait'}
          # Simplified space-separated query for Bing (it does not take
          # Google's OR / when: syntax).
          BING_QUERY = {'Iran attack US base Bahrain OR Kuwait':
                        'iran attack us base bahrain kuwait'}


          def bing_url(q):
              return ("https://www.bing.com/news/search?q="
                      + urllib.parse.quote(BING_QUERY[q])
                      + "&format=rss&count=30")


          def fetch_items_rss2json(url):
              api = ("https://api.rss2json.com/v1/api.json?rss_url="
                     + urllib.parse.quote(url, safe=""))
              req = urllib.request.Request(api, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  d = json.loads(r.read().decode("utf-8", "replace"))
              if d.get("status") != "ok":
                  raise RuntimeError("rss2json status: %s" % d.get("status"))
              items = []
              for it in d.get("items") or []:
                  title = (it.get("title") or "").strip()
                  link = (it.get("link") or "").strip()
                  pub = (it.get("pubDate") or "").strip()
                  if not title or not link or not pub:
                      continue
                  try:
                      when = parsedate_to_datetime(pub)
                  except (TypeError, ValueError):
                      continue
                  if when is None:
                      continue
                  if when.tzinfo is None:
                      when = when.replace(tzinfo=timezone.utc)
                  items.append({"title": title, "link": link, "when": when})
              return items


          def fetch_query(q):
              """Fetch one query: direct Google News, up to 2 tries, then the
              rss2json fallback and the Bing News RSS fallback for the war
              query. Raises only if all paths fail, so the caller can keep
              the last good file."""
              url = gnews_url(q)
              last_err = None
              for attempt in range(2):
                  try:
                      return fetch_items(url)
                  except Exception as e:
                      last_err = e
                      print(f"direct fetch failed ({q}) attempt {attempt + 1}: {e}")
                      time.sleep(10)
              if q in FALLBACK_QUERIES:
                  try:
                      return fetch_items_rss2json(url)
                  except Exception as e:
                      last_err = e
                      print(f"rss2json fallback failed ({q}): {e}")
                  try:
                      return fetch_items(bing_url(q))
                  except Exception as e:
                      last_err = e
                      print(f"bing fallback failed ({q}): {e}")
              raise last_err


          def strip_outlet(title):
              return re.sub(r"\s+-[^-]{2,40}$", "", title).strip()


          def first8_key(title):
              norm = strip_outlet(title).lower()
              norm = re.sub(r"[^a-z0-9\s]", " ", norm)
              norm = re.sub(r"\s+", " ", norm).strip()
              return " ".join(norm.split(" ")[:8]) if norm else ""


          ATTACK_WORDS = re.compile(
              r"\b(attack|attacks|attacked|attacking|strike|strikes|struck|striking|"
              r"target|targets|targeted|targeting|drone|drones|missile|missiles|"
              r"fired|firing|bomb|bombed|bombing|bombs)\b")
          IRAN_WORDS = re.compile(r"\b(iran|irgc|tehran)\b")
          TARGET_WORDS = re.compile(
              r"\b(us|u\.s\.|american|america|bahrain|base|radar|hormuz|vessel|ship|"
              r"troops|fifth fleet|al-rifaa|sheikh isa|qeshm|manama)\b")
          # Headlines about a plot, a threat or a warning are not attacks.
          SKIP_WORDS = re.compile(
              r"\b(plot|plots|plotting|planning|plan|plans to|plan to|considering|"
              r"threat|threats|threatens|threatening|warns|warning|prepares|"
              r"preparing|if it attacks|will pay the price)\b")

          try:
              from zoneinfo import ZoneInfo
              ET_TZ = ZoneInfo("America/New_York")
          except Exception:
              ET_TZ = timezone.utc


          def attack_event(title, when):
              """Return (ET day, target) if the headline reports an Iran/US attack, else None.
              Target is by theater, priority order: Bahrain (incl. Sheikh Isa,
              Al-Rifaa, Manama — all the same place) beats Hormuz/Qeshm beats
              anywhere else, because one headline often names two places."""
              t = strip_outlet(title).lower()
              if "dirty bomb" in t and "detonat" not in t and "explod" not in t:
                  return None
              if SKIP_WORDS.search(t):
                  return None
              if not IRAN_WORDS.search(t):
                  return None
              if not ATTACK_WORDS.search(t):
                  return None
              if not TARGET_WORDS.search(t):
                  return None
              if any(w in t for w in ("bahrain", "sheikh isa", "al-rifaa", "manama", "isa air base")):
                  target = "bahrain"
              elif any(w in t for w in ("hormuz", "qeshm")):
                  target = "hormuz"
              else:
                  m = re.search(r"\b(iraq|syria|yemen|israel)\b", t)
                  target = m.group(1) if m else "iran"
              day = when.astimezone(ET_TZ).strftime("%Y-%m-%d")
              return (day, target)


          def count_attacks(items):
              """Count distinct Iran/US attacks: dedupe by (ET day, target), then
              merge the same target on consecutive days (one attack reported
              across two days still counts once)."""
              keys = sorted({attack_event(it["title"], it["when"])
                             for it in items} - {None})
              kept = {}
              n = 0
              for day, target in keys:
                  prev = kept.get(target)
                  if prev:
                      pd = datetime.strptime(prev, "%Y-%m-%d").date()
                      cd = datetime.strptime(day, "%Y-%m-%d").date()
                      if (cd - pd).days <= 1:
                          continue
                  kept[target] = day
                  n += 1
              return n


          def tension_level(count):
              if count <= 0:
                  return "Low"
              if count == 1:
                  return "Elevated"
              if count == 2:
                  return "High"
              return "Severe"


          def load_previous():
              """Load the previous going-on.json items (for the merge), or [].
              Items are returned in the same shape the fetcher uses
              ({title, link, when})."""
              try:
                  d = json.loads(OUT.read_text())
              except Exception:
                  return []
              items = []
              for it in d.get("items") or []:
                  title = (it.get("title") or "").strip()
                  link = (it.get("link") or "").strip()
                  date = (it.get("date") or "").strip()
                  if not title or not link or not date:
                      continue
                  try:
                      when = datetime.fromisoformat(date.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if when.tzinfo is None:
                      when = when.replace(tzinfo=timezone.utc)
                  items.append({"title": title, "link": link, "when": when})
              return items


          def main():
              now = datetime.now(timezone.utc)
              cutoff = now - timedelta(days=7)
              seen = set()
              seen8 = set()
              all_items = []
              any_ok = False
              # Merge the previous file's items first, so an attack the current
              # fetch can no longer see (Bing only reaches ~1-2 days back) is
              # carried forward until it ages out of the 7-day window, instead
              # of the count dropping when the source window moves on.
              for it in load_previous():
                  d = it["when"]
                  if d > now or d < cutoff:
                      continue
                  key = strip_outlet(it["title"]).lower()
                  if key in seen:
                      continue
                  k8 = first8_key(it["title"])
                  if k8 and k8 in seen8:
                      continue
                  seen.add(key)
                  if k8:
                      seen8.add(k8)
                  all_items.append(it)
              for q in QUERIES:
                  try:
                      fetched = fetch_query(q)
                      any_ok = True
                  except Exception as e:
                      print(f"query failed ({q}): {e}")
                      continue
                  for it in fetched:
                      d = it["when"]
                      if d > now or d < cutoff:
                          continue
                      key = strip_outlet(it["title"]).lower()
                      if key in seen:
                          continue
                      k8 = first8_key(it["title"])
                      if k8 and k8 in seen8:
                          continue
                      seen.add(key)
                      if k8:
                          seen8.add(k8)
                      all_items.append(it)
                  time.sleep(1)
              if not any_ok:
                  print("All queries failed; keeping last good going-on.json.")
                  return
              all_items.sort(key=lambda x: x["when"], reverse=True)
              n_attacks = count_attacks(all_items)
              out = {
                  "updated_at": now.isoformat().replace("+00:00", "Z"),
                  "tension": {"attacks_7d": n_attacks, "level": tension_level(n_attacks)},
                  "items": [
                      {"title": it["title"], "link": it["link"],
                       "date": it["when"].astimezone(timezone.utc).isoformat().replace("+00:00", "Z")}
                      for it in all_items
                  ],
              }
              OUT.write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
              print(f"wrote {OUT} with {len(all_items)} items, tension {n_attacks} attacks ({tension_level(n_attacks)})")


          if __name__ == "__main__":
              main()
          PYEOF
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add going-on.json
          if git diff --cached --quiet; then
            echo "No changes to going-on.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update what's going on"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"
