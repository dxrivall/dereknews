# ESPN BPI playoff odds for Derek News
# Same pattern as fpi-odds.yml: ESPN's BPI endpoint cannot be read
# reliably from a visitor's browser, so this Action fetches it
# server-side and writes a slim bpi.json at the repo root. The site
# (index.html) reads bpi.json from the same GitHub Pages origin, so
# there is no CORS problem. Runs every 6 hours (and on demand).
# Upload this file to .github/workflows/bpi-odds.yml in the repo.
# YAML fix: see kalshi-odds.yml - block scalar fetch step. GitHub
# flagged the old file at line 26 (the ':' in the Python dict).
name: BPI playoff odds

"on":
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpi-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ESPN BPI playoff odds
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, time
          url = "https://site.web.api.espn.com/apis/fitt/v3/sports/basketball/nba/powerindex?region=us&lang=en"
          def fetch_json(url, ua):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": ua})
                      return json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt} failed for {url}: {e}")
                      time.sleep(5)
              raise SystemExit(f"fetch failed after 3 attempts: {last}")

          data = fetch_json(url, "derek-news-bpi/1.0")
          proj_names = []
          for c in data.get("categories", []):
              if c.get("name") == "projections":
                  proj_names = c.get("names", [])
          keymap = {
              "probmakeplayoffs": "playoff",
              "probwindiv": "winDiv",
              "top6seed": "top6",
              "playinchance": "playIn",
          }
          teams = []
          for e in data.get("teams", []):
              t = e.get("team", {})
              rec = {"id": str(t.get("id", "")), "abbr": t.get("abbreviation", ""), "name": t.get("displayName", "")}
              for cat in e.get("categories", []):
                  if cat.get("name") != "projections":
                      continue
                  vals = cat.get("values", [])
                  for i, nm in enumerate(proj_names):
                      k = keymap.get(nm)
                      if k and i < len(vals):
                          v = vals[i]
                          rec[k] = round(float(v) * 10) / 10 if isinstance(v, (int, float)) else None
              if rec.get("playoff") is not None:
                  teams.append(rec)
          if len(teams) < 28:
              raise SystemExit(f"BPI parse only found {len(teams)} teams - not writing a bad bpi.json")
          out = {"updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 "source": "ESPN BPI (fitt v3 powerindex), fetched server-side",
                 "teams": teams}
          with open("bpi.json", "w") as f:
              json.dump(out, f, indent=1)
          print(f"wrote bpi.json with {len(teams)} teams")
          PY
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add bpi.json
          if git diff --cached --quiet; then
            echo "No changes to bpi.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update BPI playoff odds"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"

