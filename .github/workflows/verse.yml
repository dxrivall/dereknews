# Verse of the day fetcher for Derek News
# Builds verse.json server-side every 30 minutes (bible.com/verse-of-the-day
# og:image + og:description) so the Faith tab no longer depends on a
# live browser fetch of bible.com HTML, which bible.com blocks with no
# CORS headers, or on the allorigins.win proxy, which is rate-limited
# and often down. The site reads verse.json first and only falls back
# to the labs.bible.org Verse of the Day API when the file is missing
# or stale. The verse changes at 12:00 AM Eastern; GitHub cron lands
# ~hourly anyway, so the 30-minute schedule keeps the file fresh
# within an hour of the rollover.
# Failure policy: if the fetch or parse fails, the fetcher keeps the
# last good verse.json and exits 0 — no broken file is ever written.
# Fetcher source: .src/fetch_verse.py (embedded unchanged below).
name: Verse of the day

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verse-of-the-day
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verse of the day (YouVersion)
        run: |
          python3 - <<'PYEOF'
          r"""Server-side Verse of the Day for Derek News (Nov 28, 2026).

          The Faith tab used to discover today's YouVersion verse image live in
          the browser by fetching bible.com/verse-of-the-day HTML — but
          bible.com sends no CORS headers, so that fetch is blocked in every
          browser, and the allorigins.win fallback proxy is rate-limited and
          often down/blocked. That is why the verse failed to load ~90% of the
          time (reported Nov 28, 2026). This fetcher does the same discovery
          server-side (no CORS in the GitHub runner) and writes verse.json at
          the repo root; the site reads verse.json first and only falls back
          to the labs.bible.org Verse of the Day API when the file is missing
          or stale.

          Writes verse.json at the repo root:
          {date (YYYY-MM-DD Eastern), img, ref, text, source: "YouVersion",
           updated_at (UTC ISO)} where ref/text are split from the page's
          og:description with the same regex the client used
          (^((?:[1-3]\s)?[A-Z][A-Za-z]+(?:\s[A-Z][A-Za-z]+)?\s\d+:\d+(?:\s?-\s?\d+)?)).

          Failure policy: on fetch/parse failure keep the last good verse.json
          and exit 0 — never write a bad file.
          Fetcher source: .src/fetch_verse.py (embedded unchanged in the
          workflow generated by .src/gen_verse_workflow.py).
          """
          import html
          import json
          import pathlib
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta

          try:
              from zoneinfo import ZoneInfo
              ET = ZoneInfo("America/New_York")
          except Exception:
              ET = timezone(timedelta(hours=-5))


          def _repo_root():
              # Repo root: from the script file when run as a file, else the
              # working directory. Under `python3 -` (stdin heredoc, how the
              # GitHub Action runs this), __file__ is the literal string
              # '<stdin>', so Path(__file__).parent.parent resolves OUTSIDE
              # the repo — the Action would write the JSON next to the
              # checkout and commit nothing, while reporting success.
              f = globals().get("__file__", "")
              if f and f != "<stdin>":
                  p = pathlib.Path(f).resolve()
                  if p.is_file():
                      return p.parent.parent
              return pathlib.Path.cwd()


          ROOT = _repo_root()
          OUT = ROOT / "verse.json"

          PAGE = "https://www.bible.com/verse-of-the-day"
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"}

          REF_RE = re.compile(r"^((?:[1-3]\s)?[A-Z][A-Za-z]+(?:\s[A-Z][A-Za-z]+)?\s\d+:\d+(?:\s?-\s?\d+)?)")


          def meta_content(page_html, prop):
              # <meta property="og:..." content="..."> — attribute order varies.
              m = re.search(
                  r'<meta[^>]+property=["\']' + re.escape(prop) + r'["\'][^>]+content=["\']([^"\']*)',
                  page_html)
              if not m:
                  m = re.search(
                      r'<meta[^>]+content=["\']([^"\']*)[^>]+property=["\']' + re.escape(prop) + r'["\']',
                      page_html)
              return html.unescape(m.group(1)).strip() if m else ""


          def fetch_page():
              last = None
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(PAGE, headers=UA)
                      with urllib.request.urlopen(req, timeout=25) as r:
                          if r.status != 200:
                              raise ValueError(f"HTTP {r.status}")
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      last = e
                      print(f"fetch failed attempt {attempt + 1}: {e}")
                      time.sleep(5)
              raise last


          def main():
              try:
                  page_html = fetch_page()
              except Exception as e:
                  print(f"verse fetch failed; keeping last good verse.json: {e}")
                  return
              img = meta_content(page_html, "og:image")
              desc = meta_content(page_html, "og:description")
              if not img or not desc:
                  print("verse parse failed (missing og:image or og:description); "
                        "keeping last good verse.json.")
                  return
              m = REF_RE.match(desc)
              ref = m.group(1) if m else ""
              text = desc[len(ref):].strip() if m else desc
              if not text:
                  print("verse parse failed (empty verse text); keeping last good verse.json.")
                  return
              now_utc = datetime.now(timezone.utc)
              today_et = now_utc.astimezone(ET).strftime("%Y-%m-%d")
              out = {
                  "date": today_et,
                  "img": img,
                  "ref": ref,
                  "text": text,
                  "source": "YouVersion",
                  "updated_at": now_utc.isoformat().replace("+00:00", "Z"),
              }
              OUT.write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
              print(f"wrote {OUT}: {today_et} {ref}")


          if __name__ == "__main__":
              main()
          PYEOF
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add verse.json
          if git diff --cached --quiet; then
            echo "No changes to verse.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update verse of the day"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"
