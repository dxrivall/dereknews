# Live WAR II clan data for Derek News
# Pulls Clashboard's public clan page for #2JQVGQRC9 server-side
# every 5 minutes (no key, no login) and writes a slim clan.json at
# the repo root. Clashboard reads the official Supercell API by clan
# tag and is NOT Cloudflare-blocked, unlike ClashSpot / ClashofStats.
# The site (index.html) reads clan.json from the same GitHub Pages
# origin, so there is no CORS problem. Added Nov 18, 2026 (Derek
# asked for live clan info + war on the Clash of Clans tab).
# Fetcher source: .src/fetch_clan.py (embedded unchanged below).
# YAML fix: see kalshi-odds.yml - block scalar fetch step.
name: Clan data

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clan-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WAR II clan data from Clashboard
        run: |
          python3 - <<'PYEOF'
          """Live WAR II clan data for Derek News (Nov 18, 2026).

          Pulls Clashboard's public clan page for #2JQVGQRC9 server-side and
          writes a slim clan.json at the repo root. Clashboard reads the
          official Supercell API by clan tag (no key, no login) and is NOT
          Cloudflare-blocked, unlike ClashSpot / ClashofStats (both 403).
          The site (index.html) reads clan.json from the same GitHub Pages
          origin, so there is no CORS problem — the site cannot fetch
          Clashboard directly (no Access-Control-Allow-Origin header).

          The page is a Next.js app; the data lives in the React Server
          Components payload (self.__next_f.push strings). The payload holds
          TWO layers: a short summary (capital/cwl as bare {state} flags,
          plus fetchedAt = when Clashboard last pulled the API) and the full
          page data (clan object, currentWar, warLog, full capital raid
          object, full cwl object). This fetcher takes the FULL layer for
          capital/cwl (the last occurrence, which has the real fields) and
          the single occurrence for clan/currentWar/warLog.

          Failure policy (same as the Polymarket fetcher): if the fetch fails
          or the clan object cannot be parsed, exit non-zero and do NOT write
          a bad or empty clan.json — the site keeps showing the last good
          file (and the hardcoded snapshot behind that).
          Fetcher source: .src/fetch_clan.py (embedded unchanged in the
          workflow generated by .src/gen_clan_workflow.py).
          """
          import json
          import pathlib
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone

          def _repo_root():
              # Repo root: from the script file when run as a file, else the
              # working directory. Under `python3 -` (stdin heredoc, how the
              # GitHub Action runs this), __file__ is the literal string
              # '<stdin>', so Path(__file__).parent.parent resolves OUTSIDE
              # the repo — the Action was writing the JSON next to the
              # checkout and committing nothing, while reporting success.
              f = globals().get("__file__", "")
              if f and f != "<stdin>":
                  p = pathlib.Path(f).resolve()
                  if p.is_file():
                      return p.parent.parent
              return pathlib.Path.cwd()


          ROOT = _repo_root()
          OUT = ROOT / "clan.json"

          URL = "https://clashboard.gg/clan/2JQVGQRC9"
          UA = {"User-Agent": "Mozilla/5.0 (compatible; DerekNewsBot/1.0; +https://dxrivall.github.io/dereknews/)"}


          def fetch_html(url):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt} failed for {url}: {e}")
                      time.sleep(5)
              raise last


          BADGE_RE = re.compile(r"https://api-assets\.clashofclans\.com/badges/200/([A-Za-z0-9_\-]+)\.png")


          def fetch_opp_badge(tag):
              """Best-effort: fetch the opponent clan's Clashboard page by tag and
              pull their badge URL. The page carries no literal "badgeUrls" field,
              so match the 200px api-assets badge URL pattern (the page's own clan
              badge is the only 200px one; war-log opponent badges are 70px).
              Returns a badgeUrls dict {small, medium, large} — the API's three
              sizes share one hash, so small/large are built from the 200px hash —
              or None. Never raises: any failure leaves the badge null and the
              site keeps the shield fallback."""
              if not tag:
                  return None
              url = "https://clashboard.gg/clan/" + str(tag).lstrip("#").upper()
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=15) as r:
                      html = r.read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"opponent badge fetch failed for {tag}: {e}")
                  return None
              m = BADGE_RE.search(html)
              if not m:
                  print(f"no badge URL found on opponent page {tag}")
                  return None
              h = m.group(1)
              return {
                  "small": f"https://api-assets.clashofclans.com/badges/70/{h}.png",
                  "medium": f"https://api-assets.clashofclans.com/badges/200/{h}.png",
                  "large": f"https://api-assets.clashofclans.com/badges/512/{h}.png",
              }


          def _fix_text(v):
              # Repair mojibake from the RSC unicode_escape decode: non-ASCII
              # (∆, emoji flags) comes through as Latin-1 chars holding UTF-8
              # bytes, e.g. "N.â\x88\x86.Z.I" is really "N.∆.Z.I". Only strings
              # that round-trip Latin-1 -> UTF-8 are changed; anything already
              # correct (or plain Latin-1 like café) is left alone.
              if isinstance(v, str):
                  try:
                      return v.encode("latin-1").decode("utf-8")
                  except (UnicodeEncodeError, UnicodeDecodeError):
                      return v
              if isinstance(v, dict):
                  return {k: _fix_text(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [_fix_text(x) for x in v]
              return v


          def js_unescape(s):
              return s.encode("utf-8").decode("unicode_escape", errors="replace")


          def find_all(blob, key):
              """All JSON values for "key": in the RSC blob, in order."""
              out = []
              dec = json.JSONDecoder()
              for m in re.finditer(re.escape('"' + key + '":'), blob):
                  j = m.end()
                  while j < len(blob) and blob[j] in " \t\n":
                      j += 1
                  if j >= len(blob):
                      continue
                  c = blob[j]
                  if c == "n" and blob[j:j + 4] == "null":
                      out.append(None)
                  elif c in "{[" or c == '"':
                      try:
                          obj, _ = dec.raw_decode(blob[j:])
                          out.append(obj)
                      except Exception:
                          continue
                  else:
                      mm = re.match(r"-?\d+(\.\d+)?", blob[j:])
                      if mm:
                          out.append(json.loads(mm.group(0)))
              return out


          def pick_full(values):
              """Prefer the fullest object (most keys); fall back to the last."""
              objs = [v for v in values if isinstance(v, dict)]
              if not objs:
                  return values[-1] if values else None
              return max(objs, key=lambda o: len(o))


          def main():
              html = fetch_html(URL)
              parts = re.findall(r'self\.__next_f\.push\(\[1,"(.*?)"\]\)', html, re.S)
              if not parts:
                  raise SystemExit("no RSC payload found on Clashboard clan page")
              blob = "".join(js_unescape(p) for p in parts)

              clans = find_all(blob, "clan")
              clan = pick_full(clans)
              if not isinstance(clan, dict) or clan.get("tag") != "#2JQVGQRC9":
                  raise SystemExit("clan object missing or wrong tag in Clashboard payload")

              def one(key):
                  vals = find_all(blob, key)
                  return vals[-1] if vals else None

              fetched = find_all(blob, "fetchedAt")
              fetched_at = fetched[-1] if fetched and isinstance(fetched[-1], str) else None

              out = {
                  "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "fetched_at": fetched_at,
                  "source": "clashboard.gg/clan/2JQVGQRC9",
                  "clan": clan,
                  "currentWar": one("currentWar"),
                  "warLog": one("warLog"),
                  "cwl": pick_full(find_all(blob, "cwl")),
                  "capital": pick_full(find_all(blob, "capital")),
              }
              # Clashboard names the war sides decl/opp; the site reads
              # clan/opponent. Normalize so the tab renders the live score.
              cw = out["currentWar"]
              if isinstance(cw, dict):
                  cw = dict(cw)
                  if "decl" in cw:
                      cw["clan"] = cw.pop("decl")
                  if "opp" in cw:
                      cw["opponent"] = cw.pop("opp")
                  out["currentWar"] = cw
              out = _fix_text(out)
              # Opponent badge (Nov 22, 2026): the site shows the opponent's clan
              # badge on the live war card, but the WAR II page payload carries no
              # badgeUrls for the opponent — fetch their Clashboard page by tag and
              # pull the badge URL from it. Best-effort only: any failure leaves
              # badgeUrls null and the site keeps the shield fallback; it never
              # fails the run or blocks writing clan.json.
              try:
                  cw2 = out.get("currentWar")
                  if isinstance(cw2, dict):
                      opp = cw2.get("opponent")
                      if isinstance(opp, dict) and opp.get("tag"):
                          bu = fetch_opp_badge(opp["tag"])
                          if bu:
                              opp["badgeUrls"] = bu
              except Exception as e:
                  print(f"opponent badge step failed (non-fatal): {e}")
              OUT.write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
              cw = out["currentWar"]
              print(
                  f"wrote {OUT}: {clan.get('name')} {clan.get('tag')} "
                  f"Lv{clan.get('level')} members={clan.get('members')} "
                  f"warWins={clan.get('warWins')} streak={clan.get('warWinStreak')} "
                  f"currentWar={'live' if cw else 'none'} fetched_at={fetched_at}"
              )


          if __name__ == "__main__":
              main()
          PYEOF
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add clan.json
          if git diff --cached --quiet; then
            echo "No changes to clan.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update WAR II clan data"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"
