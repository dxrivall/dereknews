# News feed fetcher for Derek News
# Builds news.json server-side every 5 minutes (Bing News RSS for
# Reuters/AP + LocalSYR RSS directly) so the News tab no longer
# depends on rss2json, which serves ~1-day-old cached data. The site
# reads news.json first and only falls back to live rss2json when the
# file is missing or older than 2 hours. Same sources, whitelists
# and freshness rules as the client code.
# Failure policy: if every source fails, the fetcher keeps the last
# good news.json and exits 0 — no broken file is ever written.
# Fetcher source: .src/fetch_news.py (embedded unchanged below).
name: News feed

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news feed (Bing News + LocalSYR)
        run: |
          python3 - <<'PYEOF'
          """Server-side News feed for Derek News (Nov 20, 2026).

          The News tab used to fetch live from Google News via rss2json in the
          browser, but rss2json serves ~1-day-old cached data (verified Nov 20:
          direct Google News has Nov 20 stories, rss2json returns Nov 19 for
          the same query), so the tab showed "1d ago" headlines. This fetcher
          builds news.json server-side instead, from sources the GitHub runner
          can actually fetch fresh:
          - Bing News RSS for "reuters", "apnews", "associated press"
            (source queries return proper RSS with fresh items; generic
            "US news"/"world news" queries return HTML, so don't use them).
          - LocalSYR RSS directly (fresh, works).
          Direct AP/Reuters RSS is blocked (401/403), Google News direct is
          rate-limited on the runner, GDELT is 429, allorigins is 522, and
          CNY Central's /feed/ is 404.

          Applies the same rules as the site's client code: 7-day freshness,
          newest-first, dedupe, AP/Reuters whitelist + partisan-quote filter
          for top/nationwide/global, LocalSYR/CNY Central only for local,
          and the FILLER/BAD story filters. US vs world split is a keyword
          heuristic (a story is nationwide if it names the US / a US state /
          a US institution; otherwise global).

          Writes news.json at the repo root:
          {updated_at, sections: {top, local, nationwide, global}} where each
          item is {title, source, link, published (ISO UTC), thumb}.

          The site reads news.json first and falls back to live rss2json when
          the file is missing or older than 2 hours.

          Failure policy: if every source fails, keep the last good news.json
          and exit 0 — no broken file is ever written. If at least one source
          succeeds, write what we have (possibly a short/empty section, which
          is the honest state).
          Fetcher source: .src/fetch_news.py (embedded unchanged in the
          workflow generated by .src/gen_news_workflow.py).
          """
          import json
          import pathlib
          import re
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime

          def _repo_root():
              # Repo root: from the script file when run as a file, else the
              # working directory. Under `python3 -` (stdin heredoc, how the
              # GitHub Action runs this), __file__ is the literal string
              # '<stdin>', so Path(__file__).parent.parent resolves OUTSIDE
              # the repo — the Action was writing the JSON next to the
              # checkout and committing nothing, while reporting success.
              f = globals().get("__file__", "")
              if f and f != "<stdin>":
                  p = pathlib.Path(f).resolve()
                  if p.is_file():
                      return p.parent.parent
              return pathlib.Path.cwd()


          ROOT = _repo_root()
          OUT = ROOT / "news.json"

          UA = {"User-Agent": "Mozilla/5.0 (compatible; DerekNewsBot/1.0; +https://dxrivall.github.io/dereknews/)"}

          # Bing News RSS, source queries only — these return proper RSS with
          # fresh items. Generic "US news"/"world news" return HTML instead.
          BING_QUERIES = ["reuters", "apnews", "associated press"]
          LOCAL_FEEDS = [
              "https://www.localsyr.com/feed/",
          ]


          def bing_url(q):
              return ("https://www.bing.com/news/search?q="
                      + urllib.parse.quote(q)
                      + "&format=rss&count=30")


          def fetch_rss(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  data = r.read()
              root = ET.fromstring(data)
              items = []
              ns = {"News": "https://www.bing.com/news/search?q=reuters&format=rss&count=30"}
              for it in root.iter("item"):
                  title = (it.findtext("title") or "").strip()
                  link = (it.findtext("link") or "").strip()
                  pub = (it.findtext("pubDate") or "").strip()
                  desc = (it.findtext("description") or "").strip()
                  if not title or not link or not pub:
                      continue
                  # Bing links are a redirect (apiclick.aspx?url=<real URL>);
                  # use the real article URL.
                  m = re.search(r"[?&]url=([^&]+)", link)
                  if m:
                      try:
                          link = urllib.parse.unquote(m.group(1))
                      except Exception:
                          pass
                  # Source: Bing's News:Source element; fall back to the
                  # title suffix ("Title - Reuters").
                  source = ""
                  for el in it:
                      if el.tag.endswith("}Source") or el.tag == "Source":
                          source = (el.text or "").strip()
                          break
                  if not source:
                      i = title.rfind(" - ")
                      if i > 12:
                          source = title[i + 3:].strip()
                          title = title[:i].strip()
                  thumb = ""
                  for el in it:
                      if el.tag.endswith("}Image") or el.tag == "Image":
                          thumb = (el.text or "").strip()
                          break
                  if not thumb:
                      enc = it.find("enclosure")
                      if enc is not None and enc.get("url"):
                          thumb = enc.get("url")
                  try:
                      when = parsedate_to_datetime(pub)
                  except (TypeError, ValueError):
                      continue
                  if when is None:
                      continue
                  if when.tzinfo is None:
                      when = when.replace(tzinfo=timezone.utc)
                  items.append({"title": title, "source": source, "link": link,
                                "desc": desc, "when": when, "thumb": thumb})
              return items


          def fetch_source(name, url):
              last = None
              for attempt in range(2):
                  try:
                      return fetch_rss(url)
                  except Exception as e:
                      last = e
                      print(f"fetch failed ({name}) attempt {attempt + 1}: {e}")
                      time.sleep(5)
              raise last


          # --- filters, mirroring the site's client code exactly ---
          FILLER = [r"how to watch", r"where to watch", r"live stream",
                    r"streaming guide", r"what channel", r"start time",
                    r"tv channel", r"odds:", r"best bets", r"betting",
                    r"fantasy", r"draftkings", r"fanduel", r"horoscope",
                    r"astrology", r"zodiac", r"\bquiz\b", r"recipe",
                    r"\bdeals?\b", r"% off", r"gift guide", r"shopping",
                    r"celebrity", r"kardashian", r"the bachelor", r"spoilers",
                    r"power rankings", r"ranked:", r"every .* ranked", r"look:"]
          BAD = [r"murder", r"shooting", r"shot (dead|and)", r"stabbing",
                 r"\bkilled\b", r"\bkilling\b", r"massacre", r"hostage",
                 r"bombing", r"terrorist", r"suicide", r"overdose", r"\brape\b",
                 r"child abuse", r"deadly (crash|fire)", r"\bfatal\b",
                 r"death toll", r"war crimes", r"executed", r" Amber Alert"]
          FILLER_RE = [re.compile(p, re.I) for p in FILLER]
          BAD_RE = [re.compile(p, re.I) for p in BAD]

          POL_OK = re.compile(r"reuters|associated press|ap news|(^|\s)ap(\s|$)|united press|\bupi\b", re.I)
          POL_BLOCK = re.compile(r"cnn|fox|msnbc|newsmax|breitbart|daily wire|huffpost|huffington", re.I)
          PEOPLE = r"(trump|vance|harris|kamala|biden|walz|newsom|desantis|pelosi|schumer|mcconnell|jeffries|ocasio|aoc|musk)"
          VERBS = r"(said|says|saying|claims?|claimed|blasts?|blasted|slams?|slammed|attacks?|attacked|rips?|ripped|mocks?|mocked|warns?|warned|vows?|vowed|touts?|touted|defends?|defended|calls out|hits back|fires back|claps back)"
          HE_SAID = [
              re.compile(r"\b" + PEOPLE + r"[^.!?]{0,70}\b" + VERBS + r"\b", re.I),
              re.compile(r"\b(said|says|saying)\b[^.!?]{0,50}\b(trump|vance|harris|kamala|biden|walz)\b", re.I),
              re.compile(r"\b(opinion|commentary|editorial|analysis:)\b", re.I),
          ]

          LOCAL_OK = re.compile(r"localsyr|local syr|wsyr|news\s?channel 9|cny\s?central|wstm|wtvh", re.I)


          def ok_story(title, desc):
              t = (title or "") + " " + (desc or "")
              return not any(r.search(t) for r in FILLER_RE) and not any(r.search(t) for r in BAD_RE)


          def pol_keep(item):
              src = item["source"] or ""
              if POL_BLOCK.search(src):
                  return False
              if not POL_OK.search(src):
                  return False
              t = item["title"] + " " + (item["desc"] or "")
              return not any(r.search(t) for r in HE_SAID)


          def local_keep(item):
              src = item["source"] or ""
              link = item["link"] or ""
              if re.search(r"localsyr\.com|cnycentral\.com", link, re.I):
                  return True
              return bool(LOCAL_OK.search(src))


          # US vs world split: a story is nationwide if it names the US, a US
          # state, or a US institution. Everything else is global.
          US_STATES = ("alabama|alaska|arizona|arkansas|california|colorado|"
                       "connecticut|delaware|florida|georgia|hawaii|idaho|"
                       "illinois|indiana|iowa|kansas|kentucky|louisiana|maine|"
                       "maryland|massachusetts|michigan|minnesota|mississippi|"
                       "missouri|montana|nebraska|nevada|hampshire|jersey|"
                       "new mexico|york|carolina|dakota|ohio|oklahoma|oregon|"
                       "pennsylvania|rhode island|tennessee|texas|utah|vermont|"
                       "virginia|washington|wisconsin|wyoming|district of columbia")
          US_RE = re.compile(
              r"\b(u\.s\.|united states|america|american|washington|congress|"
              r"senate|white house|supreme court|pentagon|fbi|cdc|"
              r"federal reserve|\bthe fed\b|"
              + US_STATES + r")\b", re.I)


          def is_us(item):
              t = item["title"] + " " + (item["desc"] or "")
              return bool(US_RE.search(t))


          def clean(items, now, cutoff):
              seen = set()
              out = []
              for it in sorted(items, key=lambda x: x["when"], reverse=True):
                  d = it["when"]
                  if d > now or d < cutoff:
                      continue
                  key = it["title"].strip().lower()
                  if not key or key in seen:
                      continue
                  if not it["link"]:
                      continue
                  if not ok_story(it["title"], it["desc"]):
                      continue
                  seen.add(key)
                  out.append(it)
              return out


          def to_json_item(it):
              return {"title": it["title"], "source": it["source"],
                      "link": it["link"],
                      "published": it["when"].astimezone(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "thumb": it["thumb"] or ""}


          def main():
              now = datetime.now(timezone.utc)
              cutoff = now - timedelta(days=7)
              bing_items = []
              local_items = []
              any_ok = False
              for q in BING_QUERIES:
                  try:
                      got = fetch_source("bing:" + q, bing_url(q))
                      bing_items.extend(got)
                      any_ok = True
                      print(f"bing '{q}': {len(got)} items")
                  except Exception as e:
                      print(f"bing query failed ({q}): {e}")
                  time.sleep(1)
              for url in LOCAL_FEEDS:
                  try:
                      got = fetch_source("local:" + url, url)
                      # LocalSYR's RSS has no per-item source element; the
                      # feed itself is the source.
                      for it in got:
                          if not it["source"]:
                              it["source"] = "LocalSYR"
                      local_items.extend(got)
                      any_ok = True
                      print(f"local '{url}': {len(got)} items")
                  except Exception as e:
                      print(f"local feed failed ({url}): {e}")
              if not any_ok:
                  print("All news sources failed; keeping last good news.json.")
                  return
              nat = [it for it in clean(bing_items, now, cutoff) if pol_keep(it)]
              us = [it for it in nat if is_us(it)]
              world = [it for it in nat if not is_us(it)]
              local = [it for it in clean(local_items, now, cutoff) if local_keep(it)]
              top = nat[:15]
              sections = {
                  "top": [to_json_item(it) for it in top],
                  "local": [to_json_item(it) for it in local[:10]],
                  "nationwide": [to_json_item(it) for it in us[:10]],
                  "global": [to_json_item(it) for it in world[:10]],
              }
              out = {"updated_at": now.isoformat().replace("+00:00", "Z"),
                     "sections": sections}
              OUT.write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
              print(f"wrote {OUT}: top {len(sections['top'])}, local {len(sections['local'])}, "
                    f"nationwide {len(sections['nationwide'])}, global {len(sections['global'])}")


          if __name__ == "__main__":
              main()
          PYEOF
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to news.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update news feed"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"
