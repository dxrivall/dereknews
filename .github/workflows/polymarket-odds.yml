# Polymarket live moneyline % for Derek News
# Pulls Polymarket's public Gamma API server-side every 5 minutes
# (no key needed) and writes a slim polymarket.json at the repo root,
# in the same shape as the old kalshi.json. The site (index.html)
# reads polymarket.json from the same GitHub Pages origin, so there
# is no CORS problem. Switched from Kalshi Nov 18, 2026: the Kalshi
# % kept not loading because the Kalshi Action lands ~hourly while
# the site discards data older than 30 minutes.
# Fetcher source: .src/fetch_polymarket.py (embedded unchanged below).
# YAML fix: see kalshi-odds.yml - block scalar fetch step.
name: Polymarket odds

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Polymarket moneyline markets
        run: |
          python3 - <<'PYEOF'
          """Polymarket live moneyline % for Derek News.

          Replaces the Kalshi moneyline feed (Nov 18, 2026 — Derek asked to
          switch the Sports tab to Polymarket: the Kalshi % kept not loading
          because the Kalshi Action lands ~hourly while the site discards
          kalshi.json older than 30 minutes, so the % was hidden most of the
          time).

          Pulls Polymarket's public Gamma API (no key needed, CORS-friendly
          for servers) per sport tag and writes a slim polymarket.json at the
          repo root, in the SAME shape as kalshi.json:
          {updated_at, games: [{series, event, title, teams: {Team: pct}}]}.

          The series values are the old Kalshi tickers (KXNBAGAME etc.) on
          purpose: the site's matcher (index.html) keys games by those
          strings, so the site needs no matcher change — only the file it
          fetches and the visible label. The teams keys are Polymarket's
          outcome names (nicknames, e.g. "Grizzlies", "Pistons"), which the
          site's matcher already accepts via team.name.

          Window: keep events whose game ENDS in [today 00:00 UTC, today+7d]
          — the event's endDate is the game date (the market closes at game
          end), while startDate is unreliable: NBA dates a game event by its
          game day, but NHL dates it by when the event was created (e.g. a
          Nov 21 game has startDate Oct 25), so Gamma's start_date_min/max
          filter (which keys on startDate) silently drops NHL games. Do NOT
          use Gamma's date params; page through the league's events and
          filter by endDate in Python. Polymarket lists game markets ~day-of,
          so the % shows for today's games and appears for upcoming games as
          they are listed, not days ahead the way Kalshi did.
          Only true two-outcome moneyline markets count — Yes/No markets
          (futures, props) are skipped, and a market with a missing or zero
          price is skipped, never guessed.

          Failure policy (same as the old Kalshi fetcher): one dead league
          must not lose the other sports; if every league fails, or no games
          come back at all, exit non-zero and do NOT write a bad or empty
          polymarket.json — the site keeps showing the last good file.
          Fetcher source: .src/fetch_polymarket.py (embedded unchanged in
          the workflow generated by .src/gen_polymarket_workflow.py).
          """
          import json
          import pathlib
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          def _repo_root():
              # Repo root: from the script file when run as a file, else the
              # working directory. Under `python3 -` (stdin heredoc, how the
              # GitHub Action runs this), __file__ is the literal string
              # '<stdin>', so Path(__file__).parent.parent resolves OUTSIDE
              # the repo — the Action was writing the JSON next to the
              # checkout and committing nothing, while reporting success.
              f = globals().get("__file__", "")
              if f and f != "<stdin>":
                  p = pathlib.Path(f).resolve()
                  if p.is_file():
                      return p.parent.parent
              return pathlib.Path.cwd()


          ROOT = _repo_root()
          OUT = ROOT / "polymarket.json"

          GAMMA = "https://gamma-api.polymarket.com/events"
          UA = {"User-Agent": "Mozilla/5.0 (compatible; DerekNewsBot/1.0; +https://dxrivall.github.io/dereknews/)"}

          # tag_id from Gamma /sports (primaryTagId); series is the old
          # Kalshi ticker, kept so the site's matcher works unchanged.
          LEAGUES = [
              ("nba", 745, "KXNBAGAME"),
              ("nfl", 450, "KXNFLGAME"),
              ("mlb", 100381, "KXMLBGAME"),
              ("nhl", 899, "KXNHLGAME"),
          ]


          def fetch_json(url):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt} failed for {url}: {e}")
                      time.sleep(5)
              raise last


          def _parse(v):
              """Gamma returns outcomes/outcomePrices as JSON-encoded STRINGS
              (e.g. '["Grizzlies", "Pistons"]'), not arrays — parse them."""
              if isinstance(v, str):
                  try:
                      return json.loads(v)
                  except (TypeError, ValueError):
                      return None
              return v


          def moneyline_market(ev):
              """Return (outcomes, prices) for the event's two-team moneyline
              market, or None if there is no usable one."""
              for m in ev.get("markets") or []:
                  if m.get("sportsMarketType") != "moneyline":
                      continue
                  outcomes = _parse(m.get("outcomes"))
                  prices = _parse(m.get("outcomePrices"))
                  if not outcomes or not prices or len(outcomes) != 2 or len(prices) != 2:
                      continue
                  if set(o.lower() for o in outcomes) <= {"yes", "no"}:
                      continue
                  try:
                      p0 = float(prices[0])
                      p1 = float(prices[1])
                  except (TypeError, ValueError):
                      continue
                  if p0 <= 0 or p1 <= 0:
                      continue
                  return outcomes, (p0, p1)
              return None


          def parse_dt(s):
              if not s:
                  return None
              try:
                  d = datetime.fromisoformat(str(s).replace("Z", "+00:00"))
              except ValueError:
                  return None
              if d.tzinfo is None:
                  d = d.replace(tzinfo=timezone.utc)
              return d


          def fetch_league(league, tag_id, series, keep_min, keep_max):
              games = []
              offset = 0
              # Gamma rejects limit > 50 on /events with HTTP 406 (verified
              # Nov 18, 2026: 100 and 500 both 406, 50 works), so page at 50.
              limit = 50
              # Safety bound; the loop normally stops when a page comes back
              # short. Futures (2027 Champion etc.) have endDate far out and
              # are dropped by the keep window, so they cost pages, not games.
              max_pages = 20
              for _ in range(max_pages):
                  qs = urllib.parse.urlencode({
                      "tag_id": tag_id,
                      "active": "true",
                      "closed": "false",
                      "limit": limit,
                      "offset": offset,
                  })
                  data = fetch_json(f"{GAMMA}?{qs}")
                  if not isinstance(data, list):
                      raise RuntimeError(f"Gamma returned non-list for {league}")
                  for ev in data:
                      end = parse_dt(ev.get("endDate"))
                      if end is None or end < keep_min or end > keep_max:
                          continue
                      ml = moneyline_market(ev)
                      if not ml:
                          continue
                      outcomes, (p0, p1) = ml
                      title = (ev.get("title") or "").strip()
                      slug = (ev.get("slug") or "").strip()
                      if not title or not slug:
                          continue
                      games.append({
                          "series": series,
                          "event": slug,
                          "title": title,
                          "teams": {
                              outcomes[0]: round(p0 * 100),
                              outcomes[1]: round(p1 * 100),
                          },
                          # Sort key only: same matchup can be listed twice
                          # (e.g. Jazz vs. Lakers Nov 18 and Nov 23). The
                          # site's matcher takes the FIRST match, so the file
                          # must keep the soonest game per title. Stripped
                          # before writing, so the file keeps kalshi.json's
                          # exact shape.
                          "_end": end.isoformat(),
                      })
                  if len(data) < limit:
                      break
                  offset += limit
              return games


          def main():
              now = datetime.now(timezone.utc)
              today0 = now.replace(hour=0, minute=0, second=0, microsecond=0)
              keep_min = today0
              keep_max = today0 + timedelta(days=7, hours=23, minutes=59, seconds=59)
              out = {"updated_at": now.isoformat(), "games": []}
              failed = []
              for league, tag_id, series in LEAGUES:
                  try:
                      games = fetch_league(league, tag_id, series, keep_min, keep_max)
                  except Exception as e:
                      print(f"WARNING: skipping league {league}: {e}")
                      failed.append(league)
                      continue
                  print(f"{league}: {len(games)} games")
                  out["games"].extend(games)
              if failed and len(failed) == len(LEAGUES):
                  raise SystemExit("all Polymarket leagues failed - not writing a bad polymarket.json")
              if not out["games"]:
                  raise SystemExit("Polymarket returned 0 games for every league - not writing an empty polymarket.json")
              # Soonest game first per matchup title, so the site's matcher
              # (first match wins) always gets the next game, not a later
              # rematch of the same teams.
              out["games"].sort(key=lambda g: g["_end"])
              seen_titles = set()
              deduped = []
              for g in out["games"]:
                  key = g["title"].strip().lower()
                  if key in seen_titles:
                      continue
                  seen_titles.add(key)
                  del g["_end"]
                  deduped.append(g)
              out["games"] = deduped
              OUT.write_text(json.dumps(out, indent=2, ensure_ascii=False) + "\n")
              print(f"wrote {OUT} with {len(out['games'])} games (failed leagues: {failed})")


          if __name__ == "__main__":
              main()
          PYEOF
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add polymarket.json
          if git diff --cached --quiet; then
            echo "No changes to polymarket.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update Polymarket odds"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"
