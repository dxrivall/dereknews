# Kalshi live moneyline % for Derek News
# Runs every 5 minutes, fetches Kalshi's public market-data API (no key
# needed — it only blocks browsers, not servers), and writes a slim
# kalshi.json at the repo root. The site (index.html) reads kalshi.json
# from the same GitHub Pages origin, so there is no CORS problem.
# Upload this file to your repo at .github/workflows/kalshi-odds.yml
# and make sure GitHub Actions are enabled for the repo.
name: Kalshi odds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Kalshi moneyline markets
        run: python3 - <<'PY'
          import json, urllib.request, datetime
          series = ["KXNBAGAME", "KXNFLGAME", "KXMLBGAME", "KXNHLGAME"]
          out = {"updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "games": []}
          for s in series:
              url = ("https://api.elections.kalshi.com/trade-api/v2/events"
                     f"?series_ticker={s}&status=open&with_nested_markets=true&limit=200")
              req = urllib.request.Request(url, headers={"User-Agent": "derek-news-kalshi/1.0"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              for ev in data.get("events", []):
                  teams = {}
                  for m in ev.get("markets", []):
                      try:
                          price = float(m.get("last_price_dollars") or 0)
                      except ValueError:
                          continue
                      name = m.get("yes_sub_title") or ""
                      if name and m.get("status") == "active":
                          teams[name] = round(price * 100)
                  if len(teams) == 2:
                      out["games"].append({
                          "series": s,
                          "event": ev.get("event_ticker"),
                          "title": ev.get("title"),
                          "teams": teams,
                      })
          with open("kalshi.json", "w") as f:
              json.dump(out, f)
          print(f"wrote kalshi.json with {len(out['games'])} games")
          PY
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add kalshi.json
          git diff --cached --quiet || git commit -m "Update Kalshi odds"
          git push
