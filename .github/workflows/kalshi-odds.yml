# Kalshi live moneyline % for Derek News
# Runs every 5 minutes, fetches Kalshi's public market-data API (no key
# needed - it only blocks browsers, not servers), and writes a slim
# kalshi.json at the repo root. The site (index.html) reads kalshi.json
# from the same GitHub Pages origin, so there is no CORS problem.
# Upload this file to your repo at .github/workflows/kalshi-odds.yml
# and make sure GitHub Actions are enabled for the repo.
# YAML fix: the fetch step is a block scalar (run: |). The old form,
# run: python3 - <<'PY' with no block scalar, was invalid YAML in all
# four workflows - a ':' inside the Python broke the parse.
name: Kalshi odds

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Kalshi moneyline markets
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, time


          def fetch_json(url, ua):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": ua})
                      return json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      last = e
                      print(f"fetch attempt {attempt} failed for {url}: {e}")
                      time.sleep(5)
              raise SystemExit(f"fetch failed after 3 attempts: {last}")


          series = ["KXNBAGAME", "KXNFLGAME", "KXMLBGAME", "KXNHLGAME"]
          out = {"updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "games": []}
          failed = []
          for s in series:
              # One dead or rate-limited series must not lose the other sports.
              try:
                  url = ("https://api.elections.kalshi.com/trade-api/v2/events"
                         f"?series_ticker={s}&status=open&with_nested_markets=true&limit=200")
                  data = fetch_json(url, "derek-news-kalshi/1.0")
              except SystemExit as e:
                  print(f"WARNING: skipping series {s}: {e}")
                  failed.append(s)
                  continue
              for ev in data.get("events", []):
                  teams = {}
                  for m in ev.get("markets", []):
                      try:
                          price = float(m.get("last_price_dollars") or 0)
                      except (ValueError, TypeError):
                          continue
                      name = m.get("yes_sub_title") or ""
                      if name and m.get("status") == "active":
                          teams[name] = round(price * 100)
                  if len(teams) == 2:
                      out["games"].append({
                          "series": s,
                          "event": ev.get("event_ticker"),
                          "title": ev.get("title"),
                          "teams": teams,
                      })
          if failed and len(failed) == len(series):
              raise SystemExit("all Kalshi series failed - not writing a bad kalshi.json")
          if not out["games"]:
              raise SystemExit("Kalshi returned 0 games for every series - not writing an empty kalshi.json")
          with open("kalshi.json", "w") as f:
              json.dump(out, f)
          print(f"wrote kalshi.json with {len(out['games'])} games (failed series: {failed})")
          PY
      - name: Commit if changed
        run: |
          git config user.name "derek-news-bot"
          git config user.email "derek-news-bot@users.noreply.github.com"
          git add kalshi.json
          if git diff --cached --quiet; then
            echo "No changes to kalshi.json; nothing to commit."
            exit 0
          fi
          git commit -m "Update Kalshi odds"
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch" || git rebase --abort
          done
          git push origin "HEAD:$branch"

